# Update azureServiceConnection and webAppName before deploying.
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'REPLACE_WITH_SERVICE_CONNECTION_NAME'
  webAppName: 'REPLACE_WITH_APP_SERVICE_NAME'

stages:
- stage: Build
  displayName: Build and publish
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - script: dotnet restore DevOpsTaskManager.csproj
      displayName: Restore dependencies

    - script: dotnet build DevOpsTaskManager.csproj --configuration $(buildConfiguration) --no-restore
      displayName: Build application

    - script: dotnet publish DevOpsTaskManager.csproj --configuration $(buildConfiguration) --no-build --output "$(Build.ArtifactStagingDirectory)/publish"
      displayName: Publish application

    - task: ArchiveFiles@2
      displayName: Create deployment ZIP
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: Publish build artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
        artifact: 'drop'

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    displayName: Deploy web app
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy ZIP to App Service
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/app.zip'
