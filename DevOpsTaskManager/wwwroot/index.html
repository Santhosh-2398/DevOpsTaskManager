<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="eyebrow">AZURE DEVOPS PRACTICE PROJECT</div>
    <header><div><h1>Task Manager</h1><p>Keep the small things moving.</p></div><span class="status">● .NET 10</span></header>
    <section class="stats"><div><strong id="total">0</strong><span>Total tasks</span></div><div><strong id="completed">0</strong><span>Completed</span></div><div><strong id="pending">0</strong><span>Remaining</span></div></section>
    <section class="panel">
      <h2>Add a new task</h2>
      <form id="task-form"><input id="title" type="text" maxlength="120" placeholder="e.g. Create an Azure build pipeline" aria-label="Task title" required /><button type="submit">Add task</button></form>
      <p id="message" role="alert"></p>
    </section>
    <section class="panel"><div class="list-heading"><h2>Your tasks</h2><span id="count-label">0 tasks</span></div><ul id="tasks"></ul><p class="empty" id="empty">No tasks yet. Add one above to get started.</p></section>
    <footer>Built with ASP.NET Core · Ready for Azure Pipelines &amp; App Service</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
